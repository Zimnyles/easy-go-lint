name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native test · ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-11-arm
            target: win32-arm64
          - os: windows-latest
            target: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.0-rc.2
          cache: false
      - run: npm ci
      - run: npm run compile
      - run: node --test dist/test/profile.test.js
      - run: npm run verify:binaries
      - run: node scripts/integration-test.js
        env:
          EASY_GO_LINT_TEST_TOOLCHAIN: local

  package:
    name: Package platform VSIX files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run package:platforms
      - uses: actions/upload-artifact@v4
        with:
          name: easy-go-lint-platform-vsix
          path: easy-go-lint-*.vsix
          if-no-files-found: error

  linux-compat:
    name: Alpine and Linux ARMv7 smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm,arm64
      - name: Alpine x64
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/work"
          alpine:latest
          /work/third_party/golangci-lint/linux-x64/golangci-lint
          version --short
      - name: Alpine ARM64
        run: >-
          docker run --rm --platform linux/arm64
          -v "${{ github.workspace }}:/work"
          arm64v8/alpine:latest
          /work/third_party/golangci-lint/linux-arm64/golangci-lint
          version --short
      - name: Linux ARMv7
        run: >-
          docker run --rm --platform linux/arm/v7
          -v "${{ github.workspace }}:/work"
          arm32v7/alpine:latest
          /work/third_party/golangci-lint/linux-armhf/golangci-lint
          version --short
